<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="calculator">

    <!-- ===== DISPLAY ===== -->
    <!-- We'll update this text via JavaScript every time a button is pressed -->
    <div class="display" id="display">0</div>

    <!-- ===== BUTTON GRID ===== -->
    <!-- data-action and data-value are custom attributes we invented ourselves.
         They're not styled by CSS — they exist purely so JavaScript can read
         "what kind of button is this?" without us writing 19 separate
         event listeners. -->
    <div class="buttons">
      <button class="btn btn-function" data-action="clear">AC</button>
      <button class="btn btn-function" data-action="sign">+/-</button>
      <button class="btn btn-function" data-action="percent">%</button>
      <button class="btn btn-operator" data-action="operator" data-value="÷">÷</button>

      <button class="btn btn-digit" data-action="digit" data-value="7">7</button>
      <button class="btn btn-digit" data-action="digit" data-value="8">8</button>
      <button class="btn btn-digit" data-action="digit" data-value="9">9</button>
      <button class="btn btn-operator" data-action="operator" data-value="×">×</button>

      <button class="btn btn-digit" data-action="digit" data-value="4">4</button>
      <button class="btn btn-digit" data-action="digit" data-value="5">5</button>
      <button class="btn btn-digit" data-action="digit" data-value="6">6</button>
      <button class="btn btn-operator" data-action="operator" data-value="-">−</button>

      <button class="btn btn-digit" data-action="digit" data-value="1">1</button>
      <button class="btn btn-digit" data-action="digit" data-value="2">2</button>
      <button class="btn btn-digit" data-action="digit" data-value="3">3</button>
      <button class="btn btn-operator" data-action="operator" data-value="+">+</button>

      <button class="btn btn-digit btn-zero" data-action="digit" data-value="0">0</button>
      <button class="btn btn-digit" data-action="decimal">.</button>
      <button class="btn btn-operator" data-action="equals">=</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
